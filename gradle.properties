# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Mod Properties
# Per-target properties live in versions/<target>/gradle.properties

# Must fit the regex [a-z][a-z0-9_]{1,63} and match CreateGunpowder.MOD_ID.
mod_id=creategunpowder
# Base name of the built jar, which is published as
# <archives_name>-<mod_version>+<minecraft_version>-<mod_loader>.jar
mod_archives_name=CreateGunpowder
mod_name=Create: Gunpowder
mod_license=All Rights Reserved
mod_version=1.0.2
# Should match the base package used for the mod sources.
mod_group_id=com.aspctt.creategunpowder
mod_authors=aspctt
mod_description=Gunpowder as a Create production chain! Flint, coal, and sand become gunpowder through pressing, milling, and a heated mix.
