modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/aspctt/create-gunpowder/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
logoFile = "icon.png"
authors = "${mod_authors}"
displayURL = "https://modrinth.com/mod/create-gunpowder"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Every recipe this mod adds runs on Create's press, millstone, crushing wheels and mixer.
# Loading after Create puts this mod's data pack above Create's, which is what lets the
# files in data/create/recipe/milling switch off Create's own coal, charcoal and sandstone
# milling recipes. With "NONE" the two packs land in discovery order instead.
[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"
